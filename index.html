    <!-- Primary Meta Tags -->

    <meta name="title" content="Exam Snap — Sarkari Doc Prep | Your Documents. Perfectly Exam-Ready." />
    <meta name="description" content="Resize, crop, compress and prepare your passport photos, signatures, thumb impressions, and PDFs for SSC, UPSC, IBPS, Railways & Govt Exams. 100% Free, Private & In-Browser." />
    <meta name="keywords" content="SSC photo resizer, UPSC photo compressor, signature resizer 20kb, sarkari doc prep, exam snap, thumb impression resizer, govt exam photo tool" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://examsnap.in/" />
    <meta property="og:title" content="Exam Snap — Sarkari Doc Prep" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />

    <meta property="twitter:title" content="Exam Snap — Sarkari Doc Prep" />
    <meta property="twitter:description" content="Your Documents. Perfectly Exam-Ready." />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- PWA Manifest & Mobile App Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#14213D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Razorpay Checkout Script (Client side) -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" async></script>
    <script>
      // Automatically unregister service worker and purge stale cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
  </head>
  <body class="bg-brand-lightBg text-brand-dark antialiased font-sans selection:bg-saffron selection:text-navy-900">

  </body>
